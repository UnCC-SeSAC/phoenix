name: Create Jira Issue

on:
  issues:
    types: [opened]

jobs:
  create-issue:
    name: Create Jira issue from GitHub issue
    runs-on: ubuntu-latest
    steps:
      # ─────────────────────────────────────────────
      # 1) Jira 로그인
      # ─────────────────────────────────────────────
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      # ─────────────────────────────────────────────
      # 2) GitHub 마크다운 -> Jira 문법 변환
      # ─────────────────────────────────────────────
      - name: Convert GitHub Markdown to Jira Syntax
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### GitHub Issue
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      # ─────────────────────────────────────────────
      # 3) 담당자 / 라벨 / 우선순위 값을 만들어서 fields JSON으로 조립
      # ─────────────────────────────────────────────
      - name: Build extra Jira fields (assignee, labels, priority)
        id: extra_fields
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -e

          # ── ① 담당자 매핑: GitHub 아이디 -> Jira 계정 이메일 ──
          declare -A ASSIGNEE_MAP=(
            ["go-wt-flow"]="csw6115@example.com"
            ["albitro"]="rjh2280@gmail.com"
            ["Chopper-Tony"]="hi.hello.bonjour.ciao@gmail.com"
            ["caron2002"]="qkrtkddnr122@gmail.com"
            ["git-songsh"]="songsoo0037@gmail.com"
            ["Yoobin-Seo"]="seoyb1128@naver.com"
          )
          GH_ASSIGNEE="${{ github.event.issue.assignee.login }}"
          ASSIGNEE_ID=""
          if [ -n "$GH_ASSIGNEE" ] && [ "$GH_ASSIGNEE" != "null" ] && [ -n "${ASSIGNEE_MAP[$GH_ASSIGNEE]:-}" ]; then
            ASSIGNEE_ID=$(curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/user/search?query=${ASSIGNEE_MAP[$GH_ASSIGNEE]}" \
              | jq -r '.[0].accountId // empty')
          fi

          # ── ② 라벨 매핑: GitHub 라벨 -> Jira 라벨 (이 3개만 동기화, 나머진 무시) ──
          declare -A LABEL_MAP=(
            ["bug"]="bug"
            ["enhancement"]="enhance"
            ["documentation"]="doc"
          )
          RAW_LABELS=$(echo '${{ toJson(github.event.issue.labels) }}' | jq -r '.[].name')
          JIRA_LABELS="[]"
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            mapped="${LABEL_MAP[$label]:-}"
            if [ -n "$mapped" ]; then
              JIRA_LABELS=$(echo "$JIRA_LABELS" | jq --arg l "$mapped" '. + [$l]')
            fi
          done <<< "$RAW_LABELS"

          # ── ③ Priority: GitHub Issue fields에서 읽어와서 Jira Priority로 매핑 ──
          FIELD_VALUES=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_FULL/issues/$ISSUE_NUMBER/issue-field-values")

          GH_PRIORITY=$(echo "$FIELD_VALUES" | jq -r '.[]? | select(.name=="Priority") | .value // empty')

          # ⚠️ 배열 인덱싱 대신 case 문 사용 (빈 값이 들어와도 절대 에러 안 남)
          case "$GH_PRIORITY" in
            "Urgent") JIRA_PRIORITY="Highest" ;;
            "High")   JIRA_PRIORITY="High" ;;
            "Medium") JIRA_PRIORITY="Medium" ;;
            "Low")    JIRA_PRIORITY="Low" ;;
            *)        JIRA_PRIORITY="Medium" ;;
          esac

          # ── ④ 최종 fields JSON 조립 ──
          FIELDS_JSON=$(jq -n \
            --arg assigneeId "$ASSIGNEE_ID" \
            --argjson labels "$JIRA_LABELS" \
            --arg priority "$JIRA_PRIORITY" \
            '{}
             + (if $assigneeId != "" then {assignee: {accountId: $assigneeId}} else {} end)
             + (if ($labels | length) > 0 then {labels: $labels} else {} end)
             + (if $priority != "" then {priority: {name: $priority}} else {} end)')

          echo "결과 fields: $FIELDS_JSON"

          {
            echo "fields_json<<JIRAFIELDS_EOF"
            echo "$FIELDS_JSON"
            echo "JIRAFIELDS_EOF"
          } >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      # 4) Jira 이슈 생성 (프로젝트는 항상 PROJ 고정)
      # ─────────────────────────────────────────────
      - name: Create Jira Issue
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: PROJ
          issuetype: Task
          summary: "${{ github.event.issue.title }}"
          description: "${{ steps.md2jira.outputs.output-text }}"
          fields: ${{ steps.extra_fields.outputs.fields_json }}

      # ─────────────────────────────────────────────
      # 5) 생성 직후 상태를 "진행 중"으로 전환
      # ─────────────────────────────────────────────
      - name: Transition new issue to In Progress
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.create.outputs.issue }}
        run: |
          # ⚠️ 실제 Jira 워크플로의 전환 이름과 정확히 일치해야 함
          TARGET_NAME="진행 중"

          TRANSITIONS=$(curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/transitions")

          TRANSITION_ID=$(echo "$TRANSITIONS" | jq -r --arg name "$TARGET_NAME" \
            '.transitions[] | select(.name==$name) | .id')

          if [ -n "$TRANSITION_ID" ] && [ "$TRANSITION_ID" != "null" ]; then
            curl -s -X POST -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" \
              "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/transitions"
            echo "✅ '$TARGET_NAME'(으)로 전환 완료"
          else
            echo "❌ 전환 이름 '$TARGET_NAME'을 찾을 수 없습니다. 사용 가능한 전환 목록:"
            echo "$TRANSITIONS" | jq -r '.transitions[].name'
          fi

      # ─────────────────────────────────────────────
      # 6) GitHub 이슈 제목에 Jira 키 + 도메인 태그 반영
      #    (프로젝트는 하나로 합쳤지만 도메인 구분은 태그로 계속 유지)
      # ─────────────────────────────────────────────
      - name: Update issue title
        uses: actions/github-script@v7
        with:
          script: |
            const milestone = context.payload.issue.milestone;
            const domainTag = milestone ? milestone.title : '';
            const jiraKey = '${{ steps.create.outputs.issue }}';
            const originalTitle = context.payload.issue.title;

            const newTitle = domainTag
              ? `[${jiraKey}] ${domainTag} ${originalTitle}`
              : `[${jiraKey}] ${originalTitle}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              title: newTitle
            });
