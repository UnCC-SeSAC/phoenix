name: Sync Jira status on issue close

on:
  issues:
    types: [closed]

jobs:
  close-jira-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira key from title
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const match = context.payload.issue.title.match(/\[([A-Z]+-\d+)\]/);
            if (!match) {
              core.setFailed('제목에서 Jira 키를 못 찾음: ' + context.payload.issue.title);
              return;
            }
            core.setOutput('jira_key', match[1]);

      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Transition Jira issue to Done
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract.outputs.jira_key }}
          transition: "Done"