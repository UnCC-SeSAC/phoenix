controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker" # SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
      # 회전도 progress로 인정
      required_movement_angle: 0.10

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0 # 앞뒤 이동
      min_vel_y: 0.0 # 좌우 이동
      max_vel_x: 0.20 # 앞뒤 이동
      max_vel_y: 0.0 # 좌우 이동
      max_vel_theta: 0.5
      min_speed_xy: 0.01
      max_speed_xy: 0.20
      min_speed_theta: 0.10
      acc_lim_x: 0.8
      acc_lim_y: 0.0 # DWB의 Y축 최대 가속도 (m/s²)
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0 # DWB의 Y축 최대 감속도 (m/s²)
      decel_lim_theta: -1.5
      vx_samples: 15
      vy_samples: 1 
      vtheta_samples: 15
      sim_time: 1.5 # 값이 작을 수록 속도를 기반으로 짧은 시간동안 궤적을 생성
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"] # "BaseObstacle" -> ObstacleFootprint
      #BaseObstacle.scale: 0.02
      ObstacleFootprint: 0.02
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 20.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 1.0
      Oscillation.oscillation_rest_time: 3.0 # Oscillation Invalid 완화를 위해
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

