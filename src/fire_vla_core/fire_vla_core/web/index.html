<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phoenix Fire Response Robot</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1018; --panel:#151c27; --line:#2c3747; --text:#f4f7fb; --muted:#9ba8b8; --accent:#f06436; --ok:#4ade80; --bad:#fb7185; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,sans-serif; }
    header { height:72px; padding:0 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    h1 { margin:0; font-size:20px; letter-spacing:.08em; } h2 { margin:0 0 14px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    main { max-width:1080px; margin:auto; padding:22px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .panel { min-width:0; padding:20px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .wide { grid-column:1/-1; }
    .status { display:inline-flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.04em; }
    .status::before { content:""; width:9px; height:9px; border-radius:50%; background:currentColor; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
    form { display:flex; gap:10px; }
    input,button { min-height:44px; border-radius:7px; border:1px solid var(--line); font:inherit; }
    input { flex:1; padding:0 13px; background:#0b1018; color:var(--text); }
    button { padding:0 24px; background:var(--accent); border-color:var(--accent); color:white; font-weight:800; cursor:pointer; }
    .mission-note { min-height:22px; margin:10px 0 0; color:var(--muted); }
    .primary { margin:0; font-size:26px; font-weight:800; overflow-wrap:anywhere; }
    .secondary { margin:5px 0 0; color:var(--muted); font-size:16px; overflow-wrap:anywhere; }
    table { width:100%; border-collapse:collapse; } th,td { padding:10px 8px; text-align:left; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    tbody tr:last-child td { border-bottom:0; }
  </style>
</head>
<body>
<header>
  <h1>FIRE RESPONSE ROBOT</h1>
  <span id="connection" class="status bad">DISCONNECTED</span>
</header>
<main>
  <section class="panel wide">
    <h2>Mission</h2>
    <form id="missionForm">
      <input id="missionInput" aria-label="Mission" placeholder="인명을 우선 확인해." required>
      <button type="submit">실행</button>
    </form>
    <p id="missionResult" class="mission-note">VLA mission boundary로 전달합니다.</p>
  </section>
  <section class="panel">
    <h2>Robot Status</h2>
    <p id="robotState" class="primary">-</p>
    <p id="robotPose" class="secondary">pose: -</p>
  </section>
  <section class="panel">
    <h2>Current Action</h2>
    <p id="actionName" class="primary">-</p>
    <p id="actionTarget" class="secondary">target: -</p>
  </section>
  <section class="panel wide">
    <h2>Detected Objects</h2>
    <table>
      <thead><tr><th>ID</th><th>Type</th><th>Confidence</th><th>Map (x, y)</th></tr></thead>
      <tbody id="objects"><tr><td colspan="4" class="muted">발견 객체 없음</td></tr></tbody>
    </table>
  </section>
  <section class="panel wide">
    <h2>Recent Result</h2>
    <p id="resultAction" class="primary">-</p>
    <p id="resultStatus" class="secondary">result: -</p>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const dash=v=>(v===null||v===undefined||v==='')?'-':String(v);
const pose=p=>p?`(${Number(p.x).toFixed(2)}, ${Number(p.y).toFixed(2)})`:'-';
function setConnection(connected){const el=$('connection');el.textContent=connected?'CONNECTED':'DISCONNECTED';el.className=`status ${connected?'ok':'bad'}`;}
function renderObjects(world){const body=$('objects'),items=[...(world.people||[]).map(x=>({...x,type:'PERSON'})),...(world.fires||[]).map(x=>({...x,type:'FIRE'}))];body.replaceChildren();if(!items.length){const row=document.createElement('tr');row.innerHTML='<td colspan="4" class="muted">발견 객체 없음</td>';body.append(row);return}for(const item of items){const row=document.createElement('tr');for(const value of [item.id,item.type,`${Math.round(Number(item.confidence||0)*100)}%`,pose(item.position)]){const cell=document.createElement('td');cell.textContent=dash(value);row.append(cell)}body.append(row)}}
function render(status){const world=status.world_model||{},robot=world.robot||{},decision=status.decision||{},current=world.current_action||{},last=world.last_action||{};$('robotState').textContent=dash(robot.navigation_status);$('robotPose').textContent=`pose: ${pose(robot.pose)}`;$('actionName').textContent=dash(decision.action||current.action);$('actionTarget').textContent=`target: ${dash(decision.target||current.target)}`;$('resultAction').textContent=last.action?`${last.action} ${dash(last.target)}`:'-';$('resultStatus').textContent=`result: ${dash(last.status)}`;renderObjects(world)}
async function refresh(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error();const status=await response.json();render(status);setConnection(Boolean(status.timestamp))}catch(_error){setConnection(false)}}
$('missionForm').addEventListener('submit',async event=>{event.preventDefault();const text=$('missionInput').value.trim();if(!text)return;try{const response=await fetch('/api/mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const data=await response.json();$('missionResult').textContent=response.ok?`전송됨: ${data.mission_id}`:`오류: ${data.error}`;if(response.ok)$('missionInput').value=''}catch(_error){$('missionResult').textContent='오류: mission boundary에 연결할 수 없습니다.'}});
refresh();setInterval(refresh,1000);
</script>
</body>
</html>
